<style>
:root{
  --navy-900:#070C2A; --navy-700:#0B1650; --navy-500:#1B2566; --blush:#FDE6EE; --lav:#A38AA7;
  --grad:linear-gradient(135deg,#F2876B 0%,#E05A9A 50%,#A64BD6 100%);
  --bg:#F5F3F8; --surface:#FFFFFF; --surface-2:#FAF8FC; --line:#E8E3EF; --hover:#F3EFF7;
  --text:#0B1442; --muted:#5E6485; --faint:#9A9DB5;
  --primary:#0B1650; --primary-ink:#FFFFFF;
  --side:#0B1650; --side-ink:#FDE6EE; --side-muted:#A9A3C4; --side-hover:rgba(253,230,238,.08); --side-active:rgba(253,230,238,.14);
  --culto:#3B6FE0; --evento:#D9960F; --reuniao:#7A55D9; --ensaio:#0F8FA0; --aniv:#D9508F; --feriado:#E04848; --data:#2E9466;
  --shadow:0 1px 2px rgba(11,20,66,.05),0 4px 16px rgba(11,20,66,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#070C2A; --surface:#0F1640; --surface-2:#0C1236; --line:#1F2858; --hover:#162055;
  --text:#F4EEF6; --muted:#A8ABCB; --faint:#6C7199;
  --primary:#FDE6EE; --primary-ink:#0B1650;
  --side:#050920; --side-hover:rgba(253,230,238,.06); --side-active:rgba(253,230,238,.11);
  --culto:#7A9BFF; --evento:#F5C451; --reuniao:#A98BFF; --ensaio:#46CDE0; --aniv:#F58BBE; --feriado:#FF7A7A; --data:#5BCF98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:"Figtree",system-ui,sans-serif;font-size:14.5px;line-height:1.4;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid #E05A9A;outline-offset:2px}

/* ---------- Barra do protótipo ---------- */
.proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:#0B1442;color:#FDE6EE;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
:root[data-theme="dark"] .proto{background:#FDE6EE;color:#0B1442}
.proto b{font-weight:700;letter-spacing:.02em}
.proto .seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:2px}
:root[data-theme="dark"] .proto .seg{background:rgba(11,20,66,.1)}
.proto .seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:.75}
.proto .seg button[aria-pressed="true"]{background:var(--grad);color:#fff;opacity:1}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:auto auto 1fr;height:100vh;overflow:hidden}
.app.no-panel{grid-template-columns:auto 1fr}

/* ---------- Menu lateral ---------- */
.side{width:248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:6px;transition:width .22s ease;overflow:hidden;position:relative;z-index:30}
.side.collapsed{width:76px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 4px 18px;border-bottom:1px solid rgba(253,230,238,.1);margin-bottom:10px;min-height:66px}
.brand img{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(253,230,238,.12)}
.brand .t{white-space:nowrap;overflow:hidden}
.brand b{display:block;font-size:16px;letter-spacing:.01em}
.brand small{color:var(--side-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button,.side-foot .row{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:12px;text-align:left;white-space:nowrap;font-weight:500;width:100%}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav .lbl{flex:1;overflow:hidden}
.nav .cnt{background:var(--grad);color:#fff;font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.side.collapsed .lbl,.side.collapsed .brand .t,.side.collapsed .theme .opt span,.side.collapsed .me .t,.side.collapsed .sec{display:none}
.side.collapsed .nav .cnt{position:absolute;top:4px;right:4px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.side.collapsed .nav button{justify-content:center;padding:10px}
.side.collapsed .nav button:hover::after{content:attr(data-tip);position:absolute;left:62px;background:var(--navy-900);color:var(--blush);padding:6px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap;box-shadow:var(--shadow)}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme{display:flex;background:rgba(253,230,238,.07);border-radius:12px;padding:3px;gap:2px}
.side.collapsed .theme{flex-direction:column}
.theme .opt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--side-muted);padding:7px 4px;border-radius:9px;font-size:12px;font-weight:600}
.theme .opt svg{width:16px;height:16px}
.theme .opt[aria-pressed="true"]{background:var(--blush);color:var(--navy-700)}
.me{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid rgba(253,230,238,.1)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--grad)}
.me .t{flex:1;min-width:0}
.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--side-muted);font-size:12px}
.side.collapsed .me{justify-content:center}
.collapse{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-muted);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
.collapse:hover{background:var(--side-hover);color:var(--side-ink)}
.side.collapsed .collapse{justify-content:center}
.side.collapsed .collapse svg{transform:rotate(180deg)}
.collapse svg{transition:transform .2s}

/* ---------- Painel do calendário ---------- */
.panel{width:292px;background:var(--surface);border-right:1px solid var(--line);padding:20px 20px 90px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.views,.mode{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.views button,.mode button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mode button svg{width:16px;height:16px}
.views button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mini-h b{font-size:15px}
.mini-h .nv{display:flex;gap:6px}
.ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text)}
.ib:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .wd{font-size:11.5px;color:var(--faint);font-weight:600;padding:4px 0}
.mini button{border:0;background:none;height:34px;border-radius:10px;font-size:13px;font-weight:500;position:relative;color:var(--text)}
.mini button:hover{background:var(--hover)}
.mini button.out{color:var(--faint)}
.mini button.today{background:var(--grad);color:#fff;font-weight:700}
.mini button .dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:2px}
.mini button .dots i{width:4px;height:4px;border-radius:50%}
.mini button.today .dots i{background:#fff!important}
.ph{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14.5px;margin-bottom:10px}
.ph small{font-weight:500;color:var(--faint);font-size:12px}
.filters{display:flex;flex-direction:column;gap:2px}
.filters label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:500}
.filters label:hover{background:var(--hover)}
.filters input{appearance:none;width:18px;height:18px;border-radius:6px;border:2px solid var(--c);margin:0;display:grid;place-items:center;flex:none}
.filters input:checked{background:var(--c)}
.filters input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
:root[data-theme="dark"] .filters input:checked::after{border-color:var(--navy-900)}
.filters .n{margin-left:auto;color:var(--faint);font-size:12px}
.camp{border-radius:16px;padding:16px;background:linear-gradient(135deg,#1d4ed8,#0B1650);color:#fff;position:relative;overflow:hidden}
.camp::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08)}
.camp small{opacity:.75;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.camp b{display:block;font-size:17px;margin:4px 0 2px}
.camp p{margin:0;font-size:13px;opacity:.85}
.camp button{margin-top:12px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600}

/* ---------- Área principal ---------- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);min-height:68px}
.burger,.top-actions .filt-btn{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;color:var(--faint)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--text);outline:none;font-size:14.5px}
.search input::placeholder{color:var(--faint)}
.top .sp{flex:1}
.bell{position:relative}
.bell .pip{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#E05A9A;box-shadow:0 0 0 2px var(--surface)}
.top .who{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.top .who b{display:block;font-size:13.5px}
.top .who small{color:var(--muted);font-size:12px}
.content{flex:1;overflow:auto;padding:24px 28px 90px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.head h1 small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:2px}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.pri:hover{opacity:.9;background:var(--primary)}
.btn svg{width:18px;height:18px}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ok{background:#2E9466;color:#fff;border-color:transparent}
.btn.no{color:var(--feriado)}

/* Barra de período */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:18px}
.bar .views{justify-self:start}
.period{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.period h1{margin:0;font-size:21px;font-weight:800;text-align:center;letter-spacing:-.01em;white-space:nowrap}
.nav-b{width:40px;height:40px;border-radius:12px}
.bar .right{justify-self:end;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;gap:8px}
.dsub{margin:-8px 0 14px;color:var(--muted);font-weight:600}
.agenda{display:none}
.cell.sel:not(.today) .num{box-shadow:inset 0 0 0 2px #E05A9A;color:#E05A9A}

@media (max-width:1560px){.mode button span{display:none}.mode button{padding:7px 10px}}

/* Grade do mês */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .wk div{padding:12px 0;text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(132px,1fr)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 8px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;transition:background .12s}
.cell:hover{background:var(--surface-2)}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--surface-2)}
.cell.out .num{color:var(--faint)}
.num{align-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;margin-bottom:2px}
.cell.today .num{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(224,90,154,.35)}
.cell.hol .num{color:var(--feriado)}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 8px 4px 6px;border-radius:8px;background:color-mix(in srgb,var(--c) 9%,var(--surface));min-width:0;white-space:nowrap}
.chip::before{content:"";width:3px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.chip .h{color:var(--muted);font-variant-numeric:tabular-nums}
.chip .tt,.chip .ts{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.chip .ts{display:none}
.chip.pend{background:none;outline:1.5px dashed var(--c);outline-offset:-1.5px}
.more{font-size:12px;color:var(--muted);font-weight:600;padding-left:6px}

/* Semana / Dia */
.wkv{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.wkv .col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:420px;display:flex;flex-direction:column;gap:8px}
.wkv .col.today{border-color:transparent;box-shadow:0 0 0 2px #E05A9A}
.wkv .dh{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wkv .dh small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.wkv .dh b{font-size:22px}
.card-ev{border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-left:3px solid var(--c)}
.card-ev small{display:block;color:var(--muted);font-size:12px}
.card-ev b{font-size:13px;font-weight:600}
.dayv{display:flex;flex-direction:column;gap:10px;max-width:760px}
.dayv .card-ev{padding:14px 16px;display:flex;gap:16px;align-items:center}
.dayv .card-ev small{font-size:14px;min-width:54px;font-weight:600;color:var(--text)}
.dayv .card-ev b{font-size:15px}
.dayv .card-ev span{display:block;color:var(--muted);font-size:13px}

/* Ano */
.yearv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.yearv .m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.yearv .m b{display:block;margin-bottom:8px}
.yearv .mini button{height:28px;font-size:12px}

/* Lista */
.listv{display:flex;flex-direction:column;gap:18px;max-width:820px}
.listv .grp h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.listv .grp h3.t{color:#E05A9A}
.row-ev{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.row-ev .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row-ev .h{min-width:52px;font-weight:600;font-variant-numeric:tabular-nums}
.row-ev .tt{font-weight:600;flex:1}
.row-ev .tag{font-size:12px;color:var(--muted)}

/* Atas / Usuários / Solicitações */
.toolbar{display:flex;gap:10px;margin-bottom:16px}
.field-s{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:42px;color:var(--faint)}
.field-s input{flex:1;border:0;background:none;outline:none;font:inherit;color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ata{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ata.pin{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.ata .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hover);color:var(--text)}
.pill.g{background:var(--grad);color:#fff}
.ata h3{margin:0;font-size:16px}
.ata p{margin:0;color:var(--muted);font-size:13.5px}
.ata .ppl{display:flex;margin-top:auto;padding-top:6px}
.ata .ppl .av{width:28px;height:28px;font-size:11px;margin-left:-6px;border:2px solid var(--surface)}
.ata .ppl .av:first-child{margin-left:0}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .u{display:flex;align-items:center;gap:12px}
.tbl .u .av{width:34px;height:34px}
.st{font-size:12.5px;color:var(--muted)}
.st b{color:var(--text);font-weight:600;letter-spacing:.1em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--text);border-image:var(--grad) 1}
.req{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.req h3{margin:0;font-size:16px}
.req .act{display:flex;gap:8px;margin-top:4px}
.req blockquote{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:13.5px}

.scrim{display:none}

/* ---------- Responsivo ---------- */
@media (max-width:1100px){
  .panel{position:fixed;top:0;bottom:0;right:0;z-index:40;transform:translateX(100%);transition:transform .22s;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .app.panel-open .panel{transform:none}
  .app{grid-template-columns:auto 1fr}
  .top-actions .filt-btn{display:inline-flex}
}
@media (max-width:760px){
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .22s;width:270px!important;z-index:45}
  .side.collapsed .theme{flex-direction:row}
  .side.collapsed .nav button{justify-content:flex-start;padding:10px 12px}
  .side.collapsed .nav .cnt{position:static;min-width:20px;height:20px;font-size:11.5px}
  .side.collapsed .me{justify-content:flex-start}
  .proto>span{display:none}
  .proto{bottom:10px}
  .side.collapsed .lbl,.side.collapsed .brand .t,.side.collapsed .theme .opt span,.side.collapsed .me .t,.side.collapsed .sec{display:revert}
  .app.drawer .side{transform:none}
  .app{grid-template-columns:1fr!important}
  .burger{display:grid}
  .collapse{display:none}
  .top{padding:10px 14px}
  .top .who .t,.search{display:none}
  .content{padding:16px 12px 90px}
  .head h1{font-size:22px;width:100%}
  .cal .g{grid-auto-rows:minmax(92px,auto)}
  .cell{padding:4px 2px;gap:2px}
  .chip{font-size:9.5px;line-height:1.25;padding:1px 3px;gap:0;border-radius:4px;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
  .chip::before{display:none}
  .chip .h{display:none}
  .chip .tt{display:none}
  .chip .ts{display:block;text-overflow:clip}
  .more{font-size:9.5px;padding-left:3px}
  .num{width:24px;height:24px;font-size:12px}
  .cell.sel{background:color-mix(in srgb,#E05A9A 8%,var(--surface))}
  .bar{grid-template-columns:1fr auto;gap:10px}
  .bar .views{grid-column:1/-1;justify-self:stretch;overflow-x:auto}
  .bar .views button{flex:1;justify-content:center;padding:7px 8px}
  .period{gap:8px}
  .period h1{font-size:17px;min-width:0}
  .nav-b{width:34px;height:34px}
  .mode button span{display:none}
  .mode button{padding:7px 9px}
  .bar .hoje{display:none}
  .top-actions .btn{height:36px;padding:0 10px}
  .agenda{display:block;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
  .agenda h3{margin:0 0 10px;font-size:15px}
  .agenda .dayv .card-ev{padding:10px 12px}
  .agenda-add{margin-top:12px;width:100%;justify-content:center}
  .cal .wk div{font-size:11px}
  .wkv{grid-template-columns:1fr}
  .wkv .col{min-height:0}
  .head .btn .bl,.top-actions .bl{display:none}
}
.app.drawer .scrim,.app.panel-open .scrim{display:block;position:fixed;inset:0;background:rgba(7,12,42,.45);z-index:35}
@media (min-width:1101px){.app.panel-open .scrim{display:none}}
</style>

function eventsOn(d){
  const k = key(d), w = d.getDay(), out = [];
  if (w===0){ out.push({c:'culto',t:'Culto de Celebração',h:'10h',l:'Templo'}); out.push({c:'culto',t:'Culto da Família',h:'18h30',l:'Templo'}); }
  if (w===2) out.push({c:'culto',t:'Culto de Terça',h:'20h',l:'Templo'});
  if (w===4) out.push({c:'culto',t:'Culto de Oração',h:'20h',l:'Ebenézer'});
  FIXOS.filter(f=>f[0]===k).forEach(f=>out.push({c:f[1],t:f[2],h:f[3]||'',l:f[4]||'',pend:!!f[5]}));
  return out.filter(e => S.filters.has(e.c) && !(e.pend && false))
            .sort((a,b)=>(parseFloat(a.h)||-1)-(parseFloat(b.h)||-1));
}

function renderNav(){
  const items = [['cal','cal','Calendário'],['req','inbox','Solicitações',S.role==='admin'?2:1],['atas','doc','Atas de reunião']];
  if (S.role==='admin') items.push(['users','users','Usuários']);

    `<button data-p="${id}" data-tip="${lb}" ${S.page===id?'aria-current="page"':''}>${svg(ic)}<span class="lbl">${lb}</span>${n?`<span class="cnt">${n}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.page=b.dataset.p; app.classList.remove('drawer'); render();});

  $('#meAv').textContent = $('#topAv').textContent = R.ini;
  $('#meName').textContent = $('#topName').textContent = R.name;

}
function applyTheme(){
  const dark = S.theme==='escuro' || (S.theme==='sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

function miniGrid(y,m,{dots=true,onPick}={}){

  let h = ['D','S','T','Q','Q','S','S'].map(d=>`<span class="wd">${d}</span>`).join('');
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i>=35 && d.getMonth()!==m) break;
    const ev = dots ? [...new Set(eventsOn(d).map(e=>e.c))].slice(0,3) : [];
    h += `<button data-k="${key(d)}" class="${d.getMonth()!==m?'out':''} ${same(d,TODAY)?'today':''}">${d.getDate()}${ev.length?`<span class="dots">${ev.map(c=>`<i style="background:var(${CATS[c][1]})"></i>`).join('')}</span>`:''}</button>`;
  }
  return `<div class="mini">${h}</div>`;
}

function renderPanel(){
  const p = $('#panel');
  if (S.page!=='cal'){ app.classList.add('no-panel'); p.hidden = true; return; }
  app.classList.remove('no-panel'); p.hidden = false;
  const y = S.cur.getFullYear(), m = S.cur.getMonth();
  const counts = {}; for (let d=1; d<=new Date(y,m+1,0).getDate(); d++){ const all=S.filters; S.filters=new Set(Object.keys(CATS)); eventsOn(new Date(y,m,d)).forEach(e=>counts[e.c]=(counts[e.c]||0)+1); S.filters=all; }
  p.innerHTML = `
    <div><div class="mini-h"><b>${MESES[m]} ${y}</b><div class="nv"><button class="ib" data-step="-1" aria-label="Mês anterior">${svg('l')}</button><button class="ib" data-step="1" aria-label="Próximo mês">${svg('r')}</button></div></div>${miniGrid(y,m)}</div>
    <div><div class="ph">Tipos de evento <small>${S.filters.size} de 7</small></div>
      <div class="filters">${Object.entries(CATS).map(([c,[l,v]])=>`<label style="--c:var(${v})"><input type="checkbox" data-c="${c}" ${S.filters.has(c)?'checked':''}>${l}<span class="n">${counts[c]||0}</span></label>`).join('')}</div></div>
    ${m===10?`<div class="camp"><small>Campanha do mês</small><b>Novembro Azul</b><p>Conscientização sobre o câncer de próstata</p>${S.role==='admin'?'<button>Editar campanha</button>':''}</div>`:''}`;
  p.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(+b.dataset.step));
  p.querySelectorAll('.mini button').forEach(b=>b.onclick=()=>{const [Y,M,D]=b.dataset.k.split('-').map(Number); S.sel=new Date(Y,M-1,D); S.cur=new Date(Y,M-1,1); if(!isMobile() && (S.view==='mes'||S.view==='ano')) S.view='dia'; app.classList.remove('panel-open'); render();});
  p.querySelectorAll('.filters input').forEach(i=>i.onchange=()=>{i.checked?S.filters.add(i.dataset.c):S.filters.delete(i.dataset.c); render();});
}

function step(n){
  if (S.view==='dia'){ S.sel.setDate(S.sel.getDate()+n); S.cur=new Date(S.sel.getFullYear(),S.sel.getMonth(),1); }
  else if (S.view==='semana'){ S.sel.setDate(S.sel.getDate()+7*n); S.cur=new Date(S.sel.getFullYear(),S.sel.getMonth(),1); }
  else if (S.view==='ano') S.cur=new Date(S.cur.getFullYear()+n,0,1);
  else S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()+n,1);
  render();
}

const curto = t => t.replace(/^Culto (de |da |do )?/,'').replace('Confraternização','Confrat.').replace('Curso Novos Membros','Novos Membros').replace('Apresentação de ','Apres. ').replace('Reunião de ','Reun. ').replace(/^Ensaio d[oe] /,'Ensaio ');
function chip(e){ return `<div class="chip ${e.pend?'pend':''}" style="--c:var(${CATS[e.c][1]})" title="${e.h?e.h+' · ':''}${e.t}">${e.h?`<span class="h">${e.h}</span><span class="h">·</span>`:''}<span class="tt">${e.t}</span><span class="ts">${curto(e.t)}</span></div>`; }
function evCard(e){ return `<div class="card-ev" style="--c:var(${CATS[e.c][1]})${e.pend?';border-left-style:dashed':''}"><small>${e.h||'Dia todo'}</small><div><b>${e.t}</b>${e.l?`<span>${e.l}</span>`:''}</div></div>`; }

const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const isMobile = () => innerWidth <= 760;
function periodo(){
  const y=S.cur.getFullYear(), m=S.cur.getMonth();
  if (S.view==='dia'){ const d=S.sel; return {title:`${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`, from:new Date(d), to:new Date(d)}; }
  if (S.view==='semana'){ const s=new Date(S.sel); s.setDate(s.getDate()-s.getDay()); const e=new Date(s); e.setDate(s.getDate()+6);
    return {title:`${s.getDate()} – ${e.getDate()} de ${MESES[e.getMonth()].toLowerCase()}`, from:s, to:e}; }
  if (S.view==='ano') return {title:String(y), from:new Date(y,0,1), to:new Date(y,11,31)};
  return {title:`${MESES[m].toLowerCase()} de ${y}`, from:new Date(y,m,1), to:new Date(y,m+1,0)};
}
function barHtml(title){
  return `<div class="bar">
    <div class="views" role="group" aria-label="Período">${[['mes','Mês'],['semana','Semana'],['dia','Dia'],['ano','Ano']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.view===v}">${l}</button>`).join('')}</div>
    <div class="period"><button class="ib nav-b" id="prev" aria-label="Anterior">${svg('l')}</button><h1 aria-live="polite">${title}</h1><button class="ib nav-b" id="next" aria-label="Próximo">${svg('r')}</button></div>
    <div class="right"><button class="btn sm hoje" id="hoje">Hoje</button>
      <div class="mode" role="group" aria-label="Modo de exibição">
        <button data-m="cal" aria-pressed="${S.mode==='cal'}" title="Calendário">${svg('cal')}<span>Calendário</span></button>
        <button data-m="lista" aria-pressed="${S.mode==='lista'}" title="Lista">${svg('list')}<span>Lista</span></button>
      </div></div>
  </div>`;
}
function listHtml(from,to){
  const days=[]; for (let d=new Date(from); d<=to; d.setDate(d.getDate()+1)){ const ev=eventsOn(d); if(ev.length) days.push([new Date(d),ev]); }
  if (!days.length) return '<p style="color:var(--muted)">Nenhum evento neste período com os filtros escolhidos.</p>';
  return `<div class="listv">${days.map(([d,ev])=>`<div class="grp"><h3 class="${same(d,TODAY)?'t':''}">${same(d,TODAY)?'Hoje · ':''}${DIAS[d.getDay()].replace('-feira','')}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}</h3>${ev.map(e=>`<div class="row-ev" style="--c:var(${CATS[e.c][1]})"><span class="dot"></span><span class="h">${e.h||'—'}</span><span class="tt">${e.t}</span><span class="tag">${e.pend?'Pendente':e.l}</span></div>`).join('')}</div>`).join('')}</div>`;
}
function renderCal(){
  const y=S.cur.getFullYear(), m=S.cur.getMonth(), P=periodo();
  let body='';
  if (S.mode==='lista') body = listHtml(P.from, P.to);
  else if (S.view==='mes'){
    const start=new Date(y,m,1-new Date(y,m,1).getDay()); let cells='';
    const weeks = Math.ceil((new Date(y,m,1).getDay()+new Date(y,m+1,0).getDate())/7);
    for (let i=0;i<weeks*7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const ev=eventsOn(d), hol=ev.some(e=>e.c==='feriado');
      cells += `<div class="cell ${d.getMonth()!==m?'out':''} ${same(d,TODAY)?'today':''} ${same(d,S.sel)?'sel':''} ${hol?'hol':''}" data-k="${key(d)}" role="button" tabindex="0" aria-label="${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}, ${ev.length} eventos"><span class="num">${d.getDate()}</span>${ev.slice(0,3).map(chip).join('')}${ev.length>3?`<span class="more">+${ev.length-3}</span>`:''}</div>`;
    }
    const sel=S.sel, evs=eventsOn(sel);
    body = `<div class="cal"><div class="wk">${DS.map(d=>`<div>${d}</div>`).join('')}</div><div class="g">${cells}</div></div>
      <section class="agenda" aria-live="polite"><h3>${same(sel,TODAY)?'Hoje · ':''}${DIAS[sel.getDay()]}, ${sel.getDate()} de ${MESES[sel.getMonth()].toLowerCase()}</h3>
      <div class="dayv">${evs.map(evCard).join('')||'<p style="color:var(--muted);margin:0">Nenhum evento neste dia.</p>'}</div>
      <button class="btn pri agenda-add">${svg('plus')}${S.role==='admin'?'Adicionar neste dia':'Solicitar evento neste dia'}</button></section>`;
  } else if (S.view==='semana'){
    body = `<div class="wkv">${[...Array(7)].map((_,i)=>{const d=new Date(P.from); d.setDate(P.from.getDate()+i); return `<div class="col ${same(d,TODAY)?'today':''}"><div class="dh"><small>${DS[i]}</small><b>${d.getDate()}</b></div>${eventsOn(d).map(evCard).join('')||'<small style="color:var(--faint);text-align:center">Livre</small>'}</div>`;}).join('')}</div>`;
  } else if (S.view==='dia'){
    const ev=eventsOn(S.sel); body=`<p class="dsub">${DIAS[S.sel.getDay()]}</p><div class="dayv">${ev.map(evCard).join('')||'<p style="color:var(--muted)">Nenhum evento neste dia.</p>'}</div>`;
  } else {
    body=`<div class="yearv">${MESES.map((n,i)=>`<div class="m"><b>${n}</b>${miniGrid(y,i)}</div>`).join('')}</div>`;
  }
  $('#content').innerHTML = barHtml(P.title) + body;
  $('#topActions').innerHTML = `<button class="btn filt-btn" id="openPanel" aria-label="Filtros">${svg('filt')}<span class="bl">Filtros</span></button><button class="btn pri">${svg('plus')}<span class="bl">${S.role==='admin'?'Novo evento':'Solicitar evento'}</span></button>`;
  $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
  $('#hoje').onclick=()=>{S.cur=new Date(2026,10,1); S.sel=new Date(TODAY); render();};
  $('#openPanel').onclick=()=>app.classList.add('panel-open');
  document.querySelectorAll('.bar .views button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v; render();});
  document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m; render();});
  document.querySelectorAll('.cell').forEach(c=>{
    const pick=()=>{const [Y,M,D]=c.dataset.k.split('-').map(Number); S.sel=new Date(Y,M-1,D);
      if (isMobile()){ if (M-1!==S.cur.getMonth()) S.cur=new Date(Y,M-1,1); render(); document.querySelector('.agenda').scrollIntoView({behavior:'smooth',block:'nearest'}); }
      else { S.view='dia'; render(); } };
    c.onclick=pick; c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
  });
}

const ATAS = [
  {t:'Reunião de liderança: planejamento do Natal',d:'10/11/2026',r:'Definidos os cultos de 24 e 31/12, a escala do Musical e a campanha de arrecadação de brinquedos.',p:['PJ','MS','AL','RC'],pin:true,ev:true},
  {t:'Reunião de obreiros',d:'24/11/2026',r:'Nova escala de recepção a partir de dezembro e treinamento da Equipe do Amor no dia 06/12.',p:['DS','MO','LP'],ev:true},
  {t:'Alinhamento do Musical de Natal',d:'03/11/2026',r:'Roteiro aprovado, ensaios aos sábados às 14h e figurino por conta do MahanaDance.',p:['MO','GV']},
  {t:'Planejamento do Culto de Ano Novo',d:'28/10/2026',r:'Culto às 22h no templo de Santo André, ceia após a virada e transmissão ao vivo.',p:['PJ','AL']},
];
function renderAtas(){
  $('#content').innerHTML = `<div class="head"><h1><small>Igreja Internacional Mahanaim</small>Atas de reunião</h1>${S.role==='admin'?`<button class="btn pri">${svg('plus')}Nova ata</button>`:''}</div>
  <div class="toolbar"><label class="field-s">${svg('search')}<input placeholder="Buscar por título, participante ou assunto…"></label></div>
  <div class="cards">${ATAS.map(a=>`<article class="ata ${a.pin?'pin':''}"><div class="meta">${a.pin?`<span class="pill g">${svg('pin','i" style="width:12px;height:12px')} Fixada</span>`:''}<span>${a.d}</span>${a.ev?'<span>· ligada ao calendário</span>':''}</div><h3>${a.t}</h3><p>${a.r}</p><div class="ppl">${a.p.map(x=>`<span class="av">${x}</span>`).join('')}</div></article>`).join('')}</div>`;
}

function renderUsers(){
  const U=[['Admin Mahanaim','admin@mahanaim.demo','Admin',true],['Membro Mahanaim','membro@mahanaim.demo','User',true],['Equipe de Louvor','louvor@mahanaim.demo','User',false]];
  $('#content').innerHTML = `<div class="head"><h1><small>Só administradores veem esta tela</small>Usuários</h1><button class="btn pri">${svg('plus')}Novo usuário</button></div>
  <div class="tbl"><table><thead><tr><th>Nome</th><th>Senha</th><th>Perfil</th><th></th></tr></thead><tbody>${U.map(([n,e,p,ok])=>`<tr><td><div class="u"><span class="av">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><div><b>${n}</b><div class="st">${e}</div></div></div></td><td class="st"><b>••••••••</b><br>${ok?'Já acessou':'Aguardando 1º acesso'}</td><td><span class="pill" ${p==='Admin'?'style="background:var(--primary);color:var(--primary-ink)"':''}>${p}</span></td><td style="text-align:right"><button class="btn sm">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
}

function renderReq(){
  const admin = S.role==='admin';
  const R = [
    {t:'Retiro de Jovens',d:'Sáb, 21/11 · 8h · Externo',who:'Membro Mahanaim',m:'Saída às 8h da igreja, volta no domingo à tarde. Precisamos de 2 vans.',s:'pendente'},
    {t:'Ensaio extra do Musical',d:'Sex, 04/12 · 19h · Templo',who:'Equipe de Louvor',m:'Ensaio geral com figurino e iluminação.',s:'pendente'},
    {t:'Chá de bebê',d:'Sáb, 14/11 · 15h · Espaço Betel',who:'Membro Mahanaim',m:'',s:'aprovada'},
  ].filter(r=>admin || r.who==='Membro Mahanaim');
  const list = R.filter(r=>r.s===S.reqTab);
  $('#content').innerHTML = `<div class="head"><h1><small>${admin?'Pedidos enviados pelos membros':'Pedidos que você enviou'}</small>${admin?'Solicitações':'Minhas solicitações'}</h1>${admin?'':`<button class="btn pri">${svg('plus')}Solicitar evento</button>`}</div>
  <div class="tabs">${[['pendente','Pendentes'],['aprovada','Aprovadas'],['recusada','Recusadas']].map(([v,l])=>`<button data-t="${v}" aria-pressed="${S.reqTab===v}">${l} (${R.filter(r=>r.s===v).length})</button>`).join('')}</div>
  <div class="cards">${list.map(r=>`<article class="req"><div class="meta" style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)"><span class="pill">${r.s==='pendente'?'Pendente':'Aprovada'}</span>${admin?`por ${r.who}`:''}</div><h3>${r.t}</h3><div style="color:var(--muted)">${r.d}</div>${r.m?`<blockquote>${r.m}</blockquote>`:''}${admin&&r.s==='pendente'?'<div class="act"><button class="btn sm ok">Aprovar</button><button class="btn sm">Ajustar</button><button class="btn sm no">Recusar</button></div>':''}${!admin&&r.s==='pendente'?'<div class="act"><button class="btn sm no">Cancelar pedido</button></div>':''}</article>`).join('')||'<p style="color:var(--muted)">Nada por aqui.</p>'}</div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.reqTab=b.dataset.t; render();});
}

function render(){
  if (S.page==='users' && S.role!=='admin') S.page='cal';
  $('#topActions').innerHTML='';
  renderNav(); renderPanel();
  ({cal:renderCal, atas:renderAtas, users:renderUsers, req:renderReq})[S.page]();
}

$('#collapse').onclick=()=>{S.collapsed=!S.collapsed; store.set('mahanaim-menu',S.collapsed?'recolhido':'aberto'); renderNav();};
$('#burger').onclick=()=>app.classList.add('drawer');
$('#scrim').onclick=()=>app.classList.remove('drawer','panel-open');
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>{S.role=b.dataset.r; render();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
applyTheme(); render();
</script>
</body>
</html>
